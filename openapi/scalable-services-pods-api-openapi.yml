openapi: 3.1.0
info:
  title: Kubernetes Core API (v1) ConfigMaps Pods API
  description: 'The Kubernetes API is served by the kube-apiserver and exposes a uniform,

    versioned REST surface for cluster resources. This OpenAPI is a hand-curated

    subset of the core/v1 group covering the most common workloads — pods,

    namespaces, services, configmaps, secrets, nodes, and persistent volumes.

    Authentication is per-cluster (bearer tokens, client certs, OIDC). The base

    URL is the API server endpoint of a given cluster (no single public base).

    This file is an API Evangelist research artifact for the scalable-services

    topic.

    '
  version: 1.0.0
  contact:
    name: API Evangelist
    url: https://apievangelist.com
servers:
- url: https://kubernetes.default.svc
  description: In-cluster API server
- url: https://{cluster}:6443
  description: External cluster endpoint
  variables:
    cluster:
      default: localhost
      description: Cluster API server hostname
security:
- BearerAuth: []
tags:
- name: Pods
paths:
  /api/v1/pods:
    get:
      summary: List all pods in the cluster
      operationId: listAllPods
      tags:
      - Pods
      responses:
        '200':
          description: Pod list.
  /api/v1/namespaces/{namespace}/pods:
    parameters:
    - $ref: '#/components/parameters/Namespace'
    get:
      summary: List pods in a namespace
      operationId: listNamespacedPods
      tags:
      - Pods
      responses:
        '200':
          description: Pod list.
    post:
      summary: Create a pod
      operationId: createPod
      tags:
      - Pods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Pod created.
  /api/v1/namespaces/{namespace}/pods/{name}:
    parameters:
    - $ref: '#/components/parameters/Namespace'
    - $ref: '#/components/parameters/Name'
    get:
      summary: Read a pod
      operationId: readPod
      tags:
      - Pods
      responses:
        '200':
          description: A pod.
    put:
      summary: Replace a pod
      operationId: replacePod
      tags:
      - Pods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Replaced pod.
    delete:
      summary: Delete a pod
      operationId: deletePod
      tags:
      - Pods
      responses:
        '200':
          description: Pod deleted.
components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    Namespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ServiceAccountToken
