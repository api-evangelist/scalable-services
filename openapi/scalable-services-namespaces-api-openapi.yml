openapi: 3.2.0
info:
  title: Kubernetes Core API (v1) Namespaces API
  description: 'The Kubernetes API is served by the kube-apiserver and exposes a uniform,

    versioned REST surface for cluster resources.'
  version: 1.0.0
  contact:
    name: API Evangelist
    url: https://apievangelist.com
servers:
- url: https://kubernetes.default.svc
  description: In-cluster API server
- url: https://{cluster}:6443
  description: External cluster endpoint
  variables:
    cluster:
      default: localhost
      description: Cluster API server hostname
security:
- BearerAuth: []
tags:
- name: Namespaces
paths:
  /api/v1/namespaces:
    get:
      summary: List namespaces
      operationId: listNamespaces
      tags:
      - Namespaces
      responses:
        '200':
          description: Namespace list.
    post:
      summary: Create a namespace
      operationId: createNamespace
      tags:
      - Namespaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Namespace created.
  /api/v1/namespaces/{name}:
    parameters:
    - $ref: '#/components/parameters/Name'
    get:
      summary: Read a namespace
      operationId: readNamespace
      tags:
      - Namespaces
      responses:
        '200':
          description: A namespace.
    delete:
      summary: Delete a namespace
      operationId: deleteNamespace
      tags:
      - Namespaces
      responses:
        '200':
          description: Namespace deleted.
components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ServiceAccountToken
