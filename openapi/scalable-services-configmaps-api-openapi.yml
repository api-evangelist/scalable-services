openapi: 3.2.0
info:
  title: Kubernetes Core API (v1) Config Maps API
  description: 'The Kubernetes API is served by the kube-apiserver and exposes a uniform,

    versioned REST surface for cluster resources.'
  version: 1.0.0
  contact:
    name: API Evangelist
    url: https://apievangelist.com
servers:
- url: https://kubernetes.default.svc
  description: In-cluster API server
- url: https://{cluster}:6443
  description: External cluster endpoint
  variables:
    cluster:
      default: localhost
      description: Cluster API server hostname
security:
- BearerAuth: []
tags:
- name: ConfigMaps
paths:
  /api/v1/namespaces/{namespace}/configmaps:
    parameters:
    - $ref: '#/components/parameters/Namespace'
    get:
      summary: List configmaps in a namespace
      operationId: listConfigMaps
      tags:
      - ConfigMaps
      responses:
        '200':
          description: ConfigMap list.
    post:
      summary: Create a configmap
      operationId: createConfigMap
      tags:
      - ConfigMaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: ConfigMap created.
components:
  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ServiceAccountToken
