openapi: 3.1.0
info:
  title: Kubernetes Core API (v1)
  description: |
    The Kubernetes API is served by the kube-apiserver and exposes a uniform,
    versioned REST surface for cluster resources. This OpenAPI is a hand-curated
    subset of the core/v1 group covering the most common workloads — pods,
    namespaces, services, configmaps, secrets, nodes, and persistent volumes.
    Authentication is per-cluster (bearer tokens, client certs, OIDC). The base
    URL is the API server endpoint of a given cluster (no single public base).
    This file is an API Evangelist research artifact for the scalable-services
    topic.
  version: "1.0.0"
  contact:
    name: API Evangelist
    url: https://apievangelist.com
servers:
  - url: https://kubernetes.default.svc
    description: In-cluster API server
  - url: https://{cluster}:6443
    description: External cluster endpoint
    variables:
      cluster:
        default: localhost
        description: Cluster API server hostname
security:
  - BearerAuth: []
paths:
  /api/v1/pods:
    get:
      summary: List all pods in the cluster
      operationId: listAllPods
      tags: [Pods]
      responses:
        '200':
          description: Pod list.
  /api/v1/namespaces/{namespace}/pods:
    parameters:
      - $ref: '#/components/parameters/Namespace'
    get:
      summary: List pods in a namespace
      operationId: listNamespacedPods
      tags: [Pods]
      responses:
        '200':
          description: Pod list.
    post:
      summary: Create a pod
      operationId: createPod
      tags: [Pods]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Pod created.
  /api/v1/namespaces/{namespace}/pods/{name}:
    parameters:
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/Name'
    get:
      summary: Read a pod
      operationId: readPod
      tags: [Pods]
      responses:
        '200':
          description: A pod.
    put:
      summary: Replace a pod
      operationId: replacePod
      tags: [Pods]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Replaced pod.
    delete:
      summary: Delete a pod
      operationId: deletePod
      tags: [Pods]
      responses:
        '200':
          description: Pod deleted.
  /api/v1/namespaces:
    get:
      summary: List namespaces
      operationId: listNamespaces
      tags: [Namespaces]
      responses:
        '200':
          description: Namespace list.
    post:
      summary: Create a namespace
      operationId: createNamespace
      tags: [Namespaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Namespace created.
  /api/v1/namespaces/{name}:
    parameters:
      - $ref: '#/components/parameters/Name'
    get:
      summary: Read a namespace
      operationId: readNamespace
      tags: [Namespaces]
      responses:
        '200':
          description: A namespace.
    delete:
      summary: Delete a namespace
      operationId: deleteNamespace
      tags: [Namespaces]
      responses:
        '200':
          description: Namespace deleted.
  /api/v1/namespaces/{namespace}/services:
    parameters:
      - $ref: '#/components/parameters/Namespace'
    get:
      summary: List services in a namespace
      operationId: listNamespacedServices
      tags: [Services]
      responses:
        '200':
          description: Service list.
    post:
      summary: Create a service
      operationId: createService
      tags: [Services]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Service created.
  /api/v1/namespaces/{namespace}/services/{name}:
    parameters:
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/Name'
    get:
      summary: Read a service
      operationId: readService
      tags: [Services]
      responses:
        '200':
          description: A service.
    delete:
      summary: Delete a service
      operationId: deleteService
      tags: [Services]
      responses:
        '200':
          description: Service deleted.
  /api/v1/namespaces/{namespace}/configmaps:
    parameters:
      - $ref: '#/components/parameters/Namespace'
    get:
      summary: List configmaps in a namespace
      operationId: listConfigMaps
      tags: [ConfigMaps]
      responses:
        '200':
          description: ConfigMap list.
    post:
      summary: Create a configmap
      operationId: createConfigMap
      tags: [ConfigMaps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: ConfigMap created.
  /api/v1/namespaces/{namespace}/secrets:
    parameters:
      - $ref: '#/components/parameters/Namespace'
    get:
      summary: List secrets in a namespace
      operationId: listSecrets
      tags: [Secrets]
      responses:
        '200':
          description: Secret list.
    post:
      summary: Create a secret
      operationId: createSecret
      tags: [Secrets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Secret created.
  /api/v1/nodes:
    get:
      summary: List nodes
      operationId: listNodes
      tags: [Nodes]
      responses:
        '200':
          description: Node list.
  /api/v1/nodes/{name}:
    parameters:
      - $ref: '#/components/parameters/Name'
    get:
      summary: Read a node
      operationId: readNode
      tags: [Nodes]
      responses:
        '200':
          description: A node.
  /api/v1/persistentvolumes:
    get:
      summary: List persistent volumes
      operationId: listPersistentVolumes
      tags: [PersistentVolumes]
      responses:
        '200':
          description: PV list.
    post:
      summary: Create a persistent volume
      operationId: createPersistentVolume
      tags: [PersistentVolumes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: PV created.
components:
  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ServiceAccountToken
